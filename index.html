<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b7fe0">
<title>골목길 배드민턴</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfd6ff;color:#3a2a20;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
  input{-webkit-user-select:text;user-select:text}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  button{cursor:pointer;border:3px solid #4a2f22;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:800;color:#fff;
    background:#5b8ee6;box-shadow:0 3px 0 #4a2f22;font-family:inherit}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 #4a2f22}
  button:disabled{opacity:.45}
  button.y{background:#ffc93c;color:#4a2f22}
  button.w{background:#fff;color:#4a2f22}
  button.r{background:#ee5a5a}
  button.sm{padding:6px 10px;font-size:13px;border-width:2px;border-radius:11px;box-shadow:0 2px 0 #4a2f22}
  input,select{width:100%;padding:11px 12px;border-radius:12px;border:3px solid #4a2f22;background:#fff;color:#3a2a20;font-size:16px;font-family:inherit;font-weight:700}
  label{display:block;font-size:12px;font-weight:800;color:#6b5446;margin:10px 0 5px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .mt{margin-top:10px}
  .hidden{display:none!important}

  .card{position:relative;width:min(430px,100%);background:#fff8ef;border:4px solid #4a2f22;border-radius:26px;padding:18px 18px 16px;box-shadow:0 8px 0 #4a2f22}
  .logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo img{width:84px;height:auto;margin:-26px 0 -6px -6px}
  .logo h1{margin:0;font-size:24px;line-height:1.1;color:#3a2a20}
  .logo p{margin:3px 0 0;font-size:12px;color:#7a6252;font-weight:700}
  .animals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .ani{background:#fff;border:3px solid #e2d3c3;border-radius:14px;padding:4px 2px 2px;text-align:center;cursor:pointer;font-size:11px;font-weight:800;color:#6b5446}
  .ani img{width:100%;height:56px;object-fit:contain;display:block}
  .ani.on{border-color:#4a2f22;background:#ffe9a8}
  #status{font-size:13px;font-weight:700;min-height:18px;margin-top:10px;color:#c0392b;line-height:1.45;white-space:pre-line}
  #status.ok{color:#2b7a4b}
  .tip{font-size:11.5px;color:#7a6252;line-height:1.6;margin-top:8px;font-weight:600}
  #warnBox{display:none;background:#fff1c9;border:3px solid #4a2f22;border-radius:14px;padding:9px 10px;font-size:12.5px;font-weight:700;margin-bottom:10px;line-height:1.5}
  #warnBox a{color:#2453c8}

  /* ---------- 게임 HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}
  #hud.on{display:block}
  #hud .pe{pointer-events:auto}
  #score{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;

const PSLOTS = ['A1','A2','B1','B2'];
const isP = s => PSLOTS.includes(s);
const other = t => t==='A'?'B':'A';
const sideOf = t => t==='A'?-1:1;   // 팀 코트의 z 부호
const IN_GAME = ['serve','rally','point','paused','over'];
const NO_RENDER = qs.get('norender')==='1';   // 테스트용 (화면 그리기 생략)

/* ---------------- 모임 암호 (모임원만 입장) ----------------
   - 화면 잠금: 암호의 해시(확인값)와 비교
   - 방 입장: 방장이 "암호+방코드"로 만든 증명값을 다시 확인 → 코드를 고쳐 잠금만 우회해도 방에는 못 들어옴 */
const LOCK_ON = /^[0-9a-f]{64}$/.test(CLUB_CHECK);
let clubKey = '';
async function sha(str){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const normPw = p => String(p||'').normalize('NFC').replace(/\s+/g,'').toLowerCase();
async function tryUnlock(pw,remember){
  const n=normPw(pw); if(!n) return false;
  if(await sha('golmok-check:'+n)!==CLUB_CHECK) return false;
  clubKey=await sha('golmok-join:'+n);
  if(remember) try{ localStorage.setItem('gb_club',JSON.stringify({c:CLUB_CHECK,k:clubKey})); }catch(e){}
  return true;
}
async function proofFor(code){ return LOCK_ON ? await sha(clubKey+':'+code) : ''; }
(function initLock(){
  if(!LOCK_ON) return;
  if(!window.crypto || !crypto.subtle){ $('lock').classList.add('on'); $('pwStatus').textContent='https 주소로 열어야 해요'; return; }
  try{ const sv=JSON.parse(localStorage.getItem('gb_club')||'null'); if(sv && sv.c===CLUB_CHECK && sv.k){ clubKey=sv.k; return; } }catch(e){}
  $('lock').classList.add('on');
  const go=async()=>{ $('pwStatus').textContent='확인 중...';
    if(await tryUnlock($('inPw').value,$('pwRemember').checked)){ $('lock').classList.remove('on'); $('pwStatus').textContent=''; }
    else { $('pwStatus').textContent='암호가 달라요. 단톡방 공지를 확인해 주세요'; $('inPw').select(); } };
  $('bUnlock').onclick=go;
  $('inPw').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
})();

let mode = null;                // 'host' | 'client' | 'practice'
let peer = null, hostConn = null, myPeerId = null, myUid = 0;
let members = [];               // [{uid,id,name,animal,slot,mic,cpu}]
let settings = {target:21, cpu:1, speed:1};
let roomCode = '';
let S = null;                   // 최신 게임 상태
const conns = new Map();        // (방장) uid -> 연결
let myAnimal = 'duck';
const me = () => members.find(m=>m.uid===myUid);
const mySlot = () => (me()||{}).slot;
const memberByUid = u => members.find(m=>m.uid===u);

/* ==========================================================================
   1. 방장 — 경기 시뮬레이션
   ========================================================================== */
let G = null;
const pos = new Map();          // uid -> {x,z,ry,st,g}  (모든 아바타 위치)
function newSim(){
  return {ph:'lobby', prev:null, sc:{A:0,B:0}, st:'A', sv:null, sp:null, pl:{}, sh:{x:0,y:1,z:-3,fl:null},
          ms:'', t:0, autoT:0, ptT:0, svT:0, overT:0, dbl:false, rs:0, svIdx:{A:0,B:0}, lastSvTeam:null, over:false, flId:0};
}
function teamList(t){ return Object.values(G.pl).filter(p=>p.team===t).sort((a,b)=>a.slot<b.slot?-1:1); }
function homePos(p){
  const n = teamList(p.team).length;
  return {x: n>1 ? (p.slot[1]==='1'?-1.3:1.3) : 0, z: sideOf(p.team)*3.8};
}
function mkP(slot,uid,cpu){ return {slot,team:slot[0],uid,cpu,x:0,z:sideOf(slot[0])*3.8,h:false,g:0,ax:0,swT:0,pow:0.5,cool:0,st:0,ry:0,jy:0,vy:0}; }
function clampSide(p){
  p.x = clamp(p.x,-3.8,3.8);
  p.z = p.team==='A' ? clamp(p.z,-7.6,-0.45) : clamp(p.z,0.45,7.6);
}
function startGame(){
  // CPU 정리 후 선수 구성
  members = members.filter(m=>!m.cpu);
  G.pl = {};
  members.forEach(m=>{ if(isP(m.slot)) G.pl[m.slot]=mkP(m.slot,m.uid,false); });
  const cnt = t => Object.values(G.pl).filter(p=>p.team===t).length;
  let cu = 100;
  const addCpu = s => { const uid=cu++; const a=ANI_KEYS[Math.floor(Math.random()*ANI_KEYS.length)];
    members.push({uid,id:null,name:'CPU '+ANIMALS[a].name,animal:a,slot:s,mic:false,cpu:true}); G.pl[s]=mkP(s,uid,true); };
  if(settings.cpu>=1) ['A','B'].forEach(t=>{ if(cnt(t)===0) addCpu(t+'1'); });
  if(settings.cpu>=2) PSLOTS.forEach(s=>{ if(!G.pl[s]) addCpu(s); });
  if(cnt('A')===0 || cnt('B')===0){ members=members.filter(m=>!m.cpu); G.pl={}; return '양 팀에 최소 1명씩 필요해요 (빈자리 CPU를 켜도 됩니다)'; }
  G.dbl = cnt('A')>1 || cnt('B')>1;
  Object.values(G.pl).forEach(p=>{ const h=homePos(p); p.x=h.x; p.z=h.z; p.ry=p.team==='A'?0:Math.PI; pos.set(p.uid,{x:p.x,z:p.z,ry:p.ry,st:0,g:0}); });
  G.cpuSeq=G.cpuSeq||500;
  // 경기 중 관중은 코트 밖으로
  members.forEach(m=>{ if(!isP(m.slot)){ const q=pos.get(m.uid); if(q) pushOutOfCourt(q); } });
  G.sc={A:0,B:0}; G.st='A'; G.svIdx={A:0,B:0}; G.lastSvTeam=null; G.over=false; G.rs++;
  setupServe();
  { const mp=Object.values(G.pl).find(p=>p.uid===myUid); if(mp){ local.x=mp.x; local.z=mp.z; local.ry=mp.ry; } }
  pushRoster();
  hostEvent('toast','경기 시작!');
  return null;
}
function setupServe(){
  const t=G.st, list=teamList(t);
  if(!list.length){ endToLobby(); return; }
  if(G.lastSvTeam!==null && G.lastSvTeam!==t) G.svIdx[t]++;   // 서브권을 되찾으면 서버 교대
  G.lastSvTeam=t;
  const p=list[G.svIdx[t]%list.length];
  const even=G.sc[t]%2===0, right=t==='A'?-1:1;               // 짝수 점수 = 오른쪽 코트
  G.sp=[(even?right:-right)*1.0, sideOf(t)*3.0];
  p.x=G.sp[0]; p.z=G.sp[1]; p.swT=0;
  G.sv=p.slot; G.ph='serve'; G.svT=G.t; G.autoT=p.cpu?1.4:7;
  G.sh.fl=null; G.ms='';
}
function flightPos(f,t){
  const s=Math.min(1,t/f.T), u=1-Math.pow(1-s,1.5);
  return [f.sx+(f.lx-f.sx)*u, f.sy*(1-s)+4*f.h*s*(1-s), f.sz+(f.lz-f.sz)*u];
}
function launch(lx,lz,T,h,team,net){
  const sx=G.sh.x, sy=G.sh.y, sz=G.sh.z;
  T*=settings.speed;
  if(!net && Math.sign(sz)!==Math.sign(lz)){
    const u0=-sz/(lz-sz), s=clamp(1-Math.pow(1-u0,1/1.5),0.06,0.94);
    const need=(C.net+0.3-sy*(1-s))/(4*s*(1-s));            // 네트를 넘도록 높이 보정
    if(h<need) h=need;
  }
  G.sh.fl={id:++G.flId,sx,sy,sz,lx,lz,T,h,t:0,team,net,nx:rand(-.45,.45),nz:rand(-.4,.4)};
}
function doServe(p,pw){
  const dir=p.team==='A'?1:-1, hw=G.dbl?C.hw:C.hws;
  let lz=dir*clamp(2.3+pw*3.8,2.3,6.4), lx=rand(-hw*0.6,hw*0.6);
  if(pw>0.93 && Math.random()<0.4) lz=dir*(C.hl+rand(0.2,0.8));   // 너무 세게 = 아웃 위험
  launch(lx,lz,1.6+pw*0.4,1.8,p.team,false);
  p.cool=0.4; G.ph='rally';
  hostEvent('hit','');
}
function doHit(p,d){
  const dir=p.team==='A'?1:-1, hw=G.dbl?C.hw:C.hws, y=G.sh.y, pw=p.pow;
  let a,b,T,h,name='';
  if(p.jy>0.25 && y>1.9 && pw>=0.6){ [a,b,T,h]=[2.0,4.8,0.8,0.12]; name='점프 스매시!'; }   // 점프 중 높은 공 = 더 빠르고 날카롭게
  else if(y>2.0 && pw>=0.75){ [a,b,T,h]=[2.4,5.4,0.95,0.25]; name='스매시!'; }
  else if(pw<0.35){ [a,b,T,h]=[0.9,2.4,1.65,1.2]; }                       // 약하게 = 드롭
  else if(pw<0.75){ if(y<1.5) [a,b,T,h]=[3.2,5.4,1.35,0.7]; else [a,b,T,h]=[4.4,6.0,2.0,3.0]; }
  else [a,b,T,h]=[5.3,6.5,1.75,2.6];                                       // 세게 = 깊은 클리어
  let lz=dir*rand(a,b);
  let lx=clamp(rand(-hw*0.55,hw*0.55)+p.ax*hw*0.5,-hw+0.25,hw-0.25);
  let net=false;
  const err=0.03+Math.max(0,d-1.0)*0.25+(pw>0.93?0.25:0)+(name?0.04:0);   // 멀리서·과한 힘 = 실수 확률↑
  if(Math.random()<err){
    if(pw<0.5 || Math.random()<0.4){ net=true; lz=-dir*rand(0.05,0.25); h=0.2; T=0.6; }
    else if(Math.random()<0.5) lz=dir*(C.hl+rand(0.2,1.0));
    else lx=(Math.sign(lx)||1)*(hw+rand(0.2,0.8));
  }
  launch(lx,lz,T,h,p.team,net);
  p.cool=0.35; p.swT=0;
  hostEvent('hit',name);
}
function land(f){
  const hw=G.dbl?C.hw:C.hws, sideT=f.lz<0?'A':'B';
  const inB=Math.abs(f.lx)<=hw+0.02 && Math.abs(f.lz)<=C.hl+0.02;
  let win,call;
  if(f.net){ win=other(f.team); call='네트!'; }
  else if(inB){ win=other(sideT); call='IN'; }
  else { win=other(f.team); call='OUT'; }
  G.sh.fl=null; G.sh.x=f.lx; G.sh.z=f.lz; G.sh.y=0.04;
  awardPoint(win,`${call} · ${TEAM[win].name} 득점`);
}
function awardPoint(win,text){
  G.sc[win]++; G.st=win;
  const a=G.sc[win], b=G.sc[other(win)], cap=settings.target+9;
  G.over=(a>=settings.target && a-b>=2) || a>=cap;
  G.ms=G.over?`🏆 ${TEAM[win].name} 승리! ${G.sc.A} : ${G.sc.B}`:text;
  G.ph='point'; G.ptT=G.over?1.5:1.8; G.win=win;
  hostEvent('point','');
}
function endToLobby(){
  G.ph='lobby'; G.pl={}; G.sh.fl=null; G.ms='';
  members=members.filter(m=>!m.cpu);
  [...pos.keys()].forEach(u=>{ if(!memberByUid(u)) pos.delete(u); });
  pushRoster();
}
function cpuUpdate(p,dt){
  if(G.ph==='paused') return;
  if(G.ph==='serve' && G.sv===p.slot){ p.st=0; return; }
  const h=homePos(p); let tx=h.x, tz=h.z;
  const f=G.sh.fl, side=sideOf(p.team);
  const incoming=G.ph==='rally' && f && f.team!==p.team;
  if(incoming){
    const mates=teamList(p.team), dist=q=>Math.hypot(q.x-f.lx,q.z-f.lz);
    if(mates.reduce((m,q)=>dist(q)<dist(m)?q:m,mates[0])===p){ tx=f.lx+f.nx; tz=f.lz+side*0.35+f.nz; }
  }
  const dx=tx-p.x, dz=tz-p.z, d=Math.hypot(dx,dz), step=Math.min(d,4.0*dt);
  if(d>0.01){ p.x+=dx/d*step; p.z+=dz/d*step; }
  clampSide(p);
  p.ry = p.team==='A'?0:Math.PI;
  const sh=G.sh, ds=Math.hypot(sh.x-p.x,sh.z-p.z), mine=incoming && Math.sign(sh.z)===side;
  if(p.swT>0) p.st = sh.y>1.6?4:5;
  else if(mine && ds<3.5){ p.st = sh.y>1.6?2:3; p.g=Math.min(1,p.g+dt/GAUGE_TIME); }
  else { p.st = d>0.05?1:0; p.g=0; }
  if(mine && ds<1.8 && sh.y>2.5 && p.jy===0 && p.vy===0 && Math.random()<0.03) p.vy=4.6;
  if(p.vy!==0||p.jy>0){ p.vy-=13*dt; p.jy=Math.max(0,p.jy+p.vy*dt); if(p.jy===0) p.vy=0; }
  if(mine && ds<1.2 && sh.y<3+p.jy && p.cool<=0 && p.swT<=0){ p.pow = sh.y>2.1&&Math.random()<0.5 ? rand(0.78,0.9) : rand(0.4,0.74); p.swT=0.3; p.g=0; }
  p.ax=rand(-1,1);
}
function hostTick(dt){
  if(!G) return;
  G.t+=dt;
  const P=Object.values(G.pl);
  P.forEach(p=>{ p.cool=Math.max(0,p.cool-dt); if(p.swT>0) p.swT=Math.max(0,p.swT-dt); if(p.cpu) cpuUpdate(p,dt); });
  const sh=G.sh;
  if(G.ph==='serve'){
    const p=G.pl[G.sv]; if(!p){ setupServe(); return; }
    p.x=G.sp[0]; p.z=G.sp[1];
    sh.x=p.x+0.2; sh.y=1.0; sh.z=p.z+(p.team==='A'?1:-1)*0.5;
    G.autoT-=dt;
    if(p.swT>0 && G.t-G.svT>0.4) doServe(p,p.pow);
    else if(G.autoT<=0) doServe(p,p.cpu?rand(0.3,0.6):0.5);
  } else if(G.ph==='rally' && sh.fl){
    const f=sh.fl; f.t+=dt;
    [sh.x,sh.y,sh.z]=flightPos(f,f.t);
    if(f.t>=f.T) land(f);
    else if(f.t>0.12){
      for(const p of P){
        if(p.team===f.team || Math.sign(sh.z)!==sideOf(p.team)) continue;   // 한 팀 1회 타격, 내 코트에 온 공만
        if(p.swT<=0 || p.cool>0) continue;
        const d=Math.hypot(sh.x-p.x,sh.z-p.z);
        if(d<C.reach && sh.y<3.4+p.jy && sh.y>0.1){ doHit(p,d); break; }
      }
    }
  } else if(G.ph==='point'){
    G.ptT-=dt;
    if(G.ptT<=0){ if(G.over){ G.ph='over'; G.overT=6; } else setupServe(); }
  } else if(G.ph==='over'){
    G.overT-=dt; if(G.overT<=0) endToLobby();          // 6초 뒤 자동으로 대기실
  }
  P.forEach(p=>{ if(p.cpu) pos.set(p.uid,{x:p.x,z:p.z,ry:p.ry,st:p.st,g:Math.round(p.g*9),y:r2(p.jy)}); });
}
function pushOutOfCourt(q){
  const mx=3.9, mz=7.6;
  if(Math.abs(q.x)<mx && Math.abs(q.z)<mz){
    const dx=mx-Math.abs(q.x), dz=mz-Math.abs(q.z);
    if(dx<dz) q.x=(Math.sign(q.x)||1)*mx; else q.z=(Math.sign(q.z)||1)*mz;
  }
}
// 참가자가 보낸 위치·상태 반영
function applyMove(uid,m){
  if(!Number.isFinite(m.x)||!Number.isFinite(m.z)) return;
  const mb=memberByUid(uid); if(!mb) return;
  const q={x:clamp(m.x,-WALK.x,WALK.x), z:clamp(m.z,-WALK.z,WALK.z), ry:+m.ry||0, st:m.st|0, g:clamp(m.g|0,0,9), y:clamp(+m.y||0,0,1.5)};
  const p = G.ph!=='lobby' && isP(mb.slot) ? G.pl[mb.slot] : null;
  if(p && !p.cpu && p.uid===uid){
    if(m.rs!==G.rs) return;              // 경기 시작 전 위치(옛 정보)는 무시
    if(!(G.ph==='serve' && G.sv===p.slot)){ p.x=q.x; p.z=q.z; clampSide(p); }
    q.x=p.x; q.z=p.z; p.ax=clamp(+m.ax||0,-1,1); p.g=q.g/9; p.jy=q.y;
  } else if(G.ph!=='lobby' && G.ph!=='over') pushOutOfCourt(q);
  pos.set(uid,q);
}
function applySwing(uid,m){
  const mb=memberByUid(uid); if(!mb || G.ph==='lobby') return;
  const p=G.pl[mb.slot]; if(!p || p.uid!==uid) return;
  p.pow=clamp(+m.p||0,0,1); p.swT=0.32;   // 떼는 순간부터 0.32초 동안 맞으면 타격
}
function snapshot(){
  const sh=G.sh, f=sh.fl;
  const av=[];
  pos.forEach((q,uid)=>{ if(memberByUid(uid)) av.push([uid,r2(q.x),r2(q.z),r2(q.ry),q.st,q.g,q.y||0]); });
  return {t:'s',ph:G.ph,sc:[G.sc.A,G.sc.B],tg:settings.target,sv:G.sv?(G.pl[G.sv]||{}).uid:0,st:G.st,ms:G.ms,rs:G.rs,dbl:G.dbl,
    win:G.win||'', sp:G.ph==='serve'?G.sp:null, sh:[r2(sh.x),r2(sh.y),r2(sh.z)],
    fl:f?[f.id,r2(f.sx),r2(f.sy),r2(f.sz),r2(f.lx),r2(f.lz),r2(f.T),r2(f.h),r2(f.t),f.team]:null, av};
}
function hostCommand(c){
  if(!G || G.ph==='lobby') return;
  if(c==='A+'||c==='B+'){ if(G.ph==='over') return; G.sh.fl=null; awardPoint(c[0],`방장 판정 · ${TEAM[c[0]].name} 득점`); }
  else if(c==='A-'||c==='B-'){ const t=c[0]; if(G.sc[t]>0){ G.sc[t]--; G.over=false; hostEvent('toast',`점수 정정 · ${TEAM[t].name} -1`); if(['over','point'].includes(G.ph)) setupServe(); } }
  else if(c==='let'){ if(['rally','point','serve'].includes(G.ph)){ setupServe(); hostEvent('toast','렛! 다시 서브'); } }
  else if(c==='pause'){ if(G.ph==='paused'){ G.ph=G.prev; hostEvent('toast','경기 재개'); } else if(G.ph!=='over'){ G.prev=G.ph; G.ph='paused'; hostEvent('toast','일시정지'); } }
  else if(c==='lobby'){ endToLobby(); hostEvent('toast','대기실로 돌아왔어요'); }
}

/* ==========================================================================
   2. 방장 — 접속 관리
   ========================================================================== */
let uidSeq=1;
const lastSeen=new Map(), chatGate=new Map();
function broadcast(msg){ conns.forEach(c=>{ try{ if(c.open) c.send(msg); }catch(e){} }); }
function rosterMsg(){ return {t:'ro', m:members.map(x=>({uid:x.uid,id:x.id,name:x.name,animal:x.animal,slot:x.slot,mic:!!x.mic,cpu:!!x.cpu})), set:settings, code:roomCode}; }
function pushRoster(){ const m=rosterMsg(); broadcast(m); onRoster(m); }
function hostEvent(k,x){ const m={t:'ev',k,x}; broadcast(m); onEvent(m); }
function sendTo(uid,m){ if(uid===myUid) onMessage(m); else { const c=conns.get(uid); if(c&&c.open) c.send(m); } }
function freeSlotFor(){
  if(G.ph==='lobby') for(const s of ['A1','B1','A2','B2']) if(!members.some(m=>m.slot===s)) return s;
  return members.filter(m=>m.slot==='S').length<MAX_SPEC ? 'S' : null;
}
function spawnPos(){ const s=Math.random()<0.5?-1:1; return {x:s*rand(5,7.5), z:rand(-9,9), ry:s>0?-Math.PI/2:Math.PI/2, st:0, g:0}; }
function hostHandle(uid,m){
  if(!m || typeof m!=='object') return;
  const mb=memberByUid(uid); if(!mb) return;
  switch(m.t){
    case 'mv': applyMove(uid,m); break;
    case 'sw': applySwing(uid,m); break;
    case 'chat': {
      const x=String(m.x||'').trim().slice(0,60); if(!x) return;
      const now=performance.now(); if(now-(chatGate.get(uid)||0)<600) return; chatGate.set(uid,now);
      const out={t:'chat',u:uid,x}; broadcast(out); onChat(out); break; }
    case 'slot': {
      if(G.ph!=='lobby') return;
      if(isP(m.s) && !members.some(x=>x.slot===m.s)) mb.slot=m.s;
      else if(m.s==='S' && mb.slot!=='S' && members.filter(x=>x.slot==='S').length<MAX_SPEC) mb.slot='S';
      pushRoster(); break; }
    case 'ani': if(ANIMALS[m.a]){ mb.animal=m.a; pushRoster(); } break;
    case 'mic': mb.mic=!!m.on; pushRoster(); break;
    case 'set': if(uid!==myUid || G.ph!=='lobby') return;
      if([11,15,21].includes(+m.target)) settings.target=+m.target;
      if([0,1,2].includes(+m.cpu)) settings.cpu=+m.cpu;
      if([1.3,1,0.8].includes(+m.speed)) settings.speed=+m.speed;
      pushRoster(); break;
    case 'start': if(uid!==myUid || G.ph!=='lobby') return;
      { const err=startGame(); if(err) sendTo(uid,{t:'ev',k:'err',x:err}); } break;
    case 'cmd': if(uid===myUid) hostCommand(m.c); break;
  }
}
function hostOnConn(conn){
  let uid=0;
  conn.on('data', m=>{
    if(uid) lastSeen.set(uid,performance.now());
    if(!m || m.t==='p') return;
    if(m.t==='hello' && !uid){
      if(LOCK_ON && m.proof!==hostProof){ conn.send({t:'reject',r:'🔒 모임 암호가 맞지 않아 입장할 수 없어요'}); setTimeout(()=>conn.close(),600); return; }
      const token=String(m.token||'').slice(0,40);
      // 같은 사람이 다시 연결한 경우: 예전 연결을 정리하고 자리를 돌려줌
      const old=token && members.find(x=>x.token===token && !x.cpu);
      if(old) hostDrop(old.uid,true);
      const ghost=token && ghosts.get(token);
      if(ghost) ghosts.delete(token);
      uid=++uidSeq;
      let slot=null;
      if(ghost && isP(ghost.slot)){
        const cur=members.find(x=>x.slot===ghost.slot);
        if(!cur){ if(G.ph==='lobby') slot=ghost.slot; }
        else if(cur.cpu && G.ph!=='lobby' && G.pl[ghost.slot]){        // CPU가 대신 치던 자리 되찾기
          members=members.filter(x=>x.uid!==cur.uid); pos.delete(cur.uid);
          const p=G.pl[ghost.slot]; p.uid=uid; p.cpu=false; slot=ghost.slot;
          pos.set(uid,{x:p.x,z:p.z,ry:p.ry,st:0,g:0,y:0});
        }
      }
      if(!slot) slot=freeSlotFor();
      if(!slot){ conn.send({t:'reject',r:'방이 가득 찼어요 (선수 4명 + 관중 10명)'}); setTimeout(()=>conn.close(),600); uid=0; return; }
      const name=String(m.name||'친구').slice(0,8), animal=ANIMALS[m.animal]?m.animal:'duck';
      members.push({uid,id:conn.peer,name,animal,slot,mic:false,cpu:false,token});
      if(!pos.has(uid)) pos.set(uid, ghost&&ghost.pos&&slot==='S' ? ghost.pos : spawnPos());
      conns.set(uid,conn); lastSeen.set(uid,performance.now());
      conn.send({t:'welcome',uid,v:VERSION});
      pushRoster();
      if(S) conn.send(snapshot());
      hostEvent('toast',ghost?`${name} 님 다시 연결됨`:`${name} 님 입장!`);
      return;
    }
    if(uid) hostHandle(uid,m);
  });
  conn.on('close',()=>uid&&hostDrop(uid));
  conn.on('error',()=>uid&&hostDrop(uid));
}
const ghosts=new Map();   // 끊긴 사람 기억 (2분 안에 다시 오면 자리 복구)
function hostDrop(uid,silent){
  if(!conns.has(uid)) return;
  const c=conns.get(uid); conns.delete(uid); lastSeen.delete(uid);
  try{ c.close(); }catch(e){}
  const mb=memberByUid(uid); if(!mb) return;
  if(mb.token) ghosts.set(mb.token,{slot:mb.slot,pos:pos.get(uid),t:performance.now()});
  ghosts.forEach((g,k)=>{ if(performance.now()-g.t>120000) ghosts.delete(k); });
  members=members.filter(m=>m.uid!==uid); pos.delete(uid);
  if(G.ph!=='lobby' && isP(mb.slot) && G.pl[mb.slot]){
    const p=G.pl[mb.slot];
    if(settings.cpu>0){                       // CPU가 이어받기
      const a=mb.animal; const cu=++G.cpuSeq;
      members.push({uid:cu,id:null,name:'CPU '+ANIMALS[a].name,animal:a,slot:mb.slot,mic:false,cpu:true}); p.uid=cu; p.cpu=true;
    } else {
      delete G.pl[mb.slot];
      if(!teamList(p.team).length){ hostEvent('toast',`${TEAM[p.team].name} 인원이 없어 경기를 끝냅니다`); endToLobby(); }
      else if(G.sv===mb.slot) setupServe();
    }
  }
  pushRoster();
  if(!silent) hostEvent('toast',`${mb.name} 님 연결 끊김`);
}
let hostTimer=null, hbTimer=null;
function startHostLoop(){
  let last=performance.now(), n=0;
  hostTimer=setInterval(()=>{
    const now=performance.now(); let dt=Math.min(0.25,(now-last)/1000); last=now;
    while(dt>0){ const s=Math.min(dt,1/60); localToHost(); hostTick(s); dt-=s; }
    if(++n%4===0){ const snap=snapshot(); broadcast(snap); onSnapshot(snap); }   // 초당 15회 전송
  },1000/60);
  let lastHb=performance.now();
  hbTimer=setInterval(()=>{
    broadcast({t:'p'});
    const now=performance.now();
    // 방장 화면이 잠깐 멈췄다 돌아온 경우: 그동안 못 받은 건 참가자 잘못이 아니므로 시간 초기화
    if(now-lastHb>4000) lastSeen.forEach((t,k)=>lastSeen.set(k,now));
    lastHb=now;
    lastSeen.forEach((t,uid)=>{ if(now-t>30000) hostDrop(uid); });   // 30초 응답 없으면 연결 끊김 처리
  },1000);
}
function makeCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function peerOpts(){
  const ps=qs.get('ps');                     // 테스트용 자체 연결 서버 (예: ?ps=127.0.0.1:9000)
  if(!ps) return {debug:0};
  const [host,port]=ps.split(':'); return {host,port:+port||9000,path:'/',secure:false,debug:0};
}
let hostProof='';
function hostCreate(practice){
  if(LOCK_ON && !clubKey){ $('lock').classList.add('on'); return; }
  if(!practice && !preflight()) return;
  const name=getName();
  mode=practice?'practice':'host'; myUid=1; uidSeq=1;
  G=newSim(); pos.clear(); conns.clear(); lastSeen.clear();
  members=[{uid:1,id:null,name,animal:myAnimal,slot:'A1',mic:false,cpu:false}];
  pos.set(1,{x:0,z:-9.5,ry:0,st:0,g:0}); local.x=0; local.z=-9.5; local.ry=0;
  if(practice){ settings.cpu=1; roomCode=''; enterWorld(); startHostLoop(); pushRoster();
    startGame(); $('room').classList.remove('on');   // 혼자 연습은 바로 CPU와 경기 시작
    flash('CPU와 연습 시작!',1500); return; }
  setStatus('연결 서버에 접속하는 중... (1/2)',true);
  const tryOpen=(tries)=>{
    roomCode=makeCode();
    peer=new Peer(PREFIX+roomCode,peerOpts());
    peer.on('open',async id=>{ myPeerId=id; members[0].id=id; hostProof=await proofFor(roomCode); setStatus('',true); enterWorld(); startHostLoop(); pushRoster(); });
    peer.on('connection',hostOnConn);
    peer.on('call',onIncomingCall);
    peer.on('disconnected',()=>{ try{ peer.reconnect(); }catch(e){} });
    peer.on('error',e=>{
      if(e.type==='unavailable-id' && tries<5){ peer.destroy(); tryOpen(tries+1); return; }
      if(!S) { setStatus(peerErrText(e)); resetAll(true); }
      else if(e.type==='unavailable-id') flash('방 코드를 되찾지 못했어요. 새 방을 만들어 주세요',4000);
      console.warn('peer error',e.type,e);
    });
  };
  tryOpen(0);
}

let joinTimer=null, lastHostMsg=0;
function clientJoin(){
  if(!preflight()) return;
  const code=$('inCode').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)){ setStatus('4자리 방 코드를 입력해 주세요'); return; }
  const name=getName();
  mode='client'; roomCode=code;
  if(LOCK_ON && !clubKey){ $('lock').classList.add('on'); mode=null; return; }
  joinInfo={code,name,proof:''}; proofFor(code).then(p=>{ if(joinInfo) joinInfo.proof=p; });
  rejoinToken=Math.random().toString(36).slice(2)+Date.now().toString(36);
  setStatus('① 연결 서버에 접속하는 중...',true);
  peer=new Peer(undefined,peerOpts());
  joinOpened=false;
  peer.on('open',id=>{
    myPeerId=id;
    if(!myUid){ setStatus('② 방을 찾는 중...',true); openHostConn();
      clearTimeout(joinTimer);
      joinTimer=setTimeout(()=>{ if(mode==='client' && !myUid) backHome(joinOpened
        ? '응답이 없어요. 잠시 후 다시 시도해 주세요'
        : '방은 찾았지만 기기끼리 연결하지 못했어요.\n· 와이파이 ↔ LTE/5G를 바꿔서 다시 시도\n· 회사·학교 와이파이는 차단될 수 있어요'); },15000); }
  });
  peer.on('call',onIncomingCall);
  peer.on('disconnected',()=>{ if(mode==='client') try{ peer.reconnect(); }catch(e){} });
  peer.on('error',e=>{ if(mode!=='client') return; if(!myUid) backHome(peerErrText(e)); console.warn('peer error',e.type,e); });
}
// ---- 자동 재연결: 화면을 나갔다 오거나 잠깐 끊겨도 같은 자리로 복귀 ----
let joinInfo=null, rejoinToken=null, joinOpened=false;
const reconn={active:false,since:0,timer:null};
function openHostConn(){
  const conn=peer.connect(PREFIX+joinInfo.code,{reliable:true});
  hostConn=conn;
  conn.on('open',()=>{ if(conn!==hostConn) return; joinOpened=true; if(!myUid) setStatus('③ 입장하는 중...',true);
    const send=()=>conn.send({t:'hello',name:joinInfo.name,animal:myAnimal,token:rejoinToken,proof:joinInfo.proof});
    if(LOCK_ON && !joinInfo.proof) proofFor(joinInfo.code).then(p=>{ joinInfo.proof=p; send(); }); else send(); });
  conn.on('data',m=>{ if(conn===hostConn) onMessage(m); });
  conn.on('close',()=>{ if(conn!==hostConn || mode!=='client') return; if(!myUid) backHome('방에 연결하지 못했어요'); else startReconnect(); });
  conn.on('error',()=>{});
}
function startReconnect(){
  if(reconn.active || mode!=='client' || !myUid) return;
  reconn.active=true; reconn.since=performance.now(); setConnBanner('🔄 방장과 다시 연결하는 중...');
  const tick=()=>{
    if(mode!=='client' || !reconn.active) return;
    if(performance.now()-reconn.since>120000){ reconn.active=false; backHome('방장과 다시 연결하지 못했어요.\n방장이 방을 닫았거나 화면을 오래 나가 있었을 수 있어요'); return; }
    try{ if(peer.disconnected && !peer.destroyed) peer.reconnect(); }catch(e){}
    if(peer.open && !(hostConn && hostConn.open)){ const old=hostConn; hostConn=null; try{ old&&old.close(); }catch(e){} openHostConn(); }
    reconn.timer=setTimeout(tick,4000);
  };
  tick();
}
function setConnBanner(t){ const b=$('connBanner'); b.textContent=t||''; b.style.display=t?'block':'none'; }
function peerErrText(e){
  const t=e&&e.type;
  if(t==='peer-unavailable') return '방을 찾을 수 없어요. 코드를 확인하거나 방장이 방을 열어두었는지 확인해 주세요';
  if(t==='browser-incompatible') return '이 브라우저는 지원하지 않아요. 크롬이나 사파리 최신 버전으로 열어주세요';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')
    return '연결 서버에 접속하지 못했어요.\n· 인터넷 연결 확인 후 다시 시도\n· 와이파이 ↔ LTE/5G를 바꿔 보세요';
  if(t==='ssl-unavailable') return 'https 주소로 열어야 해요';
  return '연결 오류: '+(t||e);
}
function sendToHost(m){
  if(mode==='host'||mode==='practice') hostHandle(myUid,m);
  else if(hostConn && hostConn.open) hostConn.send(m);
}
setInterval(()=>{
  if(mode!=='client' || !myUid) return;
  if(hostConn && hostConn.open) hostConn.send({t:'p'});

  if(gap>25000){ const old=hostConn; hostConn=null; try{ old&&old.close(); }catch(e){} startReconnect(); }   // 오래 조용하면 새로 연결
  else setConnBanner(gap>6000?'⏳ 방장 응답을 기다리는 중... (방장이 화면을 나갔을 수 있어요)':'');
},1000);
// 화면으로 돌아왔을 때: 연결 상태 점검 + 화면 꺼짐 방지 다시 요청

function onMessage(m){
  if(!m) return;
  lastHostMsg=performance.now();
  switch(m.t){
    case 'p': return;
    case 's': onSnapshot(m); break;
    case 'ro': onRoster(m); break;
    case 'ev': onEvent(m); break;
    case 'chat': onChat(m); break;
    case 'welcome':
      clearTimeout(joinTimer); setStatus('',true);
      if(reconn.active || myUid){ myUid=m.uid; reconn.active=false; clearTimeout(reconn.timer); setConnBanner(''); flash('다시 연결됐어요!',1300); syncVoice(); }
      else { myUid=m.uid; enterWorld(); }
      break;
    case 'reject': backHome(m.r); break;
  }
}
let lastRs=-1, prevPh=null;
const flLocal={id:-1};
function onSnapshot(m){
  S=m;
  if(m.rs!==lastRs){ lastRs=m.rs; const q=m.av.find(a=>a[0]===myUid); if(q){ local.x=q[1]; local.z=q[2]; local.ry=q[3]; } }
  if(m.fl){

    else if(Math.abs(flLocal.t-m.fl[8])>0.12) flLocal.t=m.fl[8]+0.03;   // 어긋나면 보정

   5. 음성 대화 (마이크 켠 사람 → 모두에게 직접 전송)
   ========================================================================== */
let micStream=null, spkOn=true;
const outCalls=new Map();   // 상대 peerId -> call
const audios=new Map();     // 상대 peerId -> <audio>
async function toggleMic(){
  if(mode==='practice'){ flash('연습 모드에서는 음성이 꺼져 있어요',1500); return; }
  if(micStream){ stopMic(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ flash('이 브라우저는 마이크를 지원하지 않아요 (https 주소 필요)',2500); return; }
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  }catch(e){ micStream=null; flash(e.name==='NotAllowedError'?'마이크 권한을 허용해 주세요':'마이크를 켤 수 없어요',2500); return; }
  sendToHost({t:'mic',on:true}); updateHud(true); syncVoice();
}
function stopMic(){
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  outCalls.forEach(c=>{ try{c.close();}catch(e){} }); outCalls.clear();
  sendToHost({t:'mic',on:false}); updateHud(true);
}
function syncVoice(){
  if(!peer) return;
  const ids=new Set(members.filter(m=>!m.cpu && m.id && m.uid!==myUid).map(m=>m.id));
  if(micStream){
    ids.forEach(id=>{ if(!outCalls.has(id)){
      try{ const call=peer.call(id,micStream); if(!call) return; outCalls.set(id,call);
        call.on('close',()=>outCalls.delete(id)); call.on('error',()=>outCalls.delete(id)); }catch(e){} } });
  }
  outCalls.forEach((c,id)=>{ if(!ids.has(id)){ try{c.close();}catch(e){} outCalls.delete(id); } });
  // 마이크를 끈 사람/나간 사람의 소리 정리
  const speaking=new Set(members.filter(m=>m.mic && m.id).map(m=>m.id));
  audios.forEach((a,id)=>{ if(!speaking.has(id)){ a.srcObject=null; a.remove(); audios.delete(id); } });
}
function onIncomingCall(call){
  call.answer();
  call.on('stream',st=>{
    let a=audios.get(call.peer);
    if(!a){ a=document.createElement('audio'); a.autoplay=true; a.setAttribute('playsinline',''); document.body.appendChild(a); audios.set(call.peer,a); }
    a.srcObject=st; a.muted=!spkOn;
    const p=a.play(); if(p&&p.catch) p.catch(()=>flash('🔊 버튼을 눌러 소리를 켜 주세요',2500));
  });
  call.on('close',()=>{ const a=audios.get(call.peer); if(a){ a.remove(); audios.delete(call.peer); } });
}
function toggleSpk(){
  spkOn=!spkOn; audios.forEach(a=>{ a.muted=!spkOn; if(spkOn) a.play().catch(()=>{}); });
  if(AC && spkOn) AC.resume(); updateHud(true);
}

const POSE = {
  ready:  {x:-1.9, z:-0.25, tw:0},
  overBack:{x:-3.75,z:-0.55,tw:-0.6},  // 머리 뒤로 젖힌 백스윙
  overHit:{x:-2.0, z:0.1,  tw:0.2},    // 높은 타점
  overEnd:{x:-0.55,z:0.75, tw:0.55},   // 팔로스루 (몸 앞을 가로질러)
  underBack:{x:0.7, z:-0.5, tw:-0.55}, // 아래·뒤로 뺀 백스윙
  underHit:{x:-1.2,z:-0.1, tw:0.1},
  underEnd:{x:-2.8,z:0.5,  tw:0.45},
};
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>1-Math.pow(1-t,3);
function poseMix(a,b,t){ return {x:lerp(a.x,b.x,t), z:lerp(a.z,b.z,t), tw:lerp(a.tw,b.tw,t)}; }
function animPose(av,st,g,dt){
  // st: 0 대기, 1 걷기, 2 오버 힘모으기, 3 언더 힘모으기, 4 오버 스윙, 5 언더 스윙
  if(st>=4 && av.lastSt!==st){ av.swT=0; av.swFrom={...av.cur}; }
  av.lastSt=st;
  let target;
  if(st===2) target=poseMix(POSE.ready,POSE.overBack,ease(g));
  else if(st===3) target=poseMix(POSE.ready,POSE.underBack,ease(g));
  if(st>=4){
    av.swT+=dt; const T=av.swT, over=st===4;
    const hit=over?POSE.overHit:POSE.underHit, end=over?POSE.overEnd:POSE.underEnd;
    let p;
    if(T<0.11) p=poseMix(av.swFrom,hit,Math.pow(T/0.11,2));          // 빠르게 가속해 타점까지
    else if(T<0.24) p=poseMix(hit,end,ease((T-0.11)/0.13));            // 팔로스루
    else p=poseMix(end,POSE.ready,ease(Math.min(1,(T-0.24)/0.25)));   // 준비 자세로 복귀
    av.cur=p;
  } else if(target){ av.cur=poseMix(av.cur,target,Math.min(1,dt*18)); }
  else av.cur=poseMix(av.cur,POSE.ready,Math.min(1,dt*10));
  av.m.arm.rotation.x=av.cur.x; av.m.arm.rotation.z=av.cur.z;
  av.m.body.rotation.y=av.cur.tw;
  av.m.armL.rotation.x=-av.cur.tw*1.2-0.3;
  // 걷기
  const walking = st===1 || av.moveSpd>0.3;
  av.walkPh += walking ? dt*13 : 0;
  const sw=walking?Math.sin(av.walkPh)*0.55:0;
  av.m.legs[0].rotation.x=lerp(av.m.legs[0].rotation.x,sw,0.4); av.m.legs[1].rotation.x=lerp(av.m.legs[1].rotation.x,-sw,0.4);
  av.m.body.position.y = walking?Math.abs(Math.sin(av.walkPh))*0.06:lerp(av.m.body.position.y,0,0.2);
  av.m.headG.rotation.z = walking?Math.sin(av.walkPh)*0.05:0;
  av.m.body.rotation.x = st===2? -0.12*g : st===4 && av.swT<0.3 ? 0.18 : 0;
}

/* ---------- 아바타 관리 (모델 + 이름표 + 말풍선) ---------- */
const avatars=new Map();   // uid -> {...}
function shirtFor(mb){ return isP(mb.slot) ? TEAM[mb.slot[0]].shirt : ANIMALS[mb.animal].def; }
function syncAvatars(){
  const live=new Set();
  members.forEach(mb=>{
    live.add(mb.uid);
    const key=mb.animal+'|'+shirtFor(mb);
    let av=avatars.get(mb.uid);
    if(av && av.key!==key){ scene.remove(av.m.root); av.m=buildAnimal(mb.animal,shirtFor(mb)); scene.add(av.m.root); av.key=key; av.m.root.position.set(av.x,0,av.z); }
    if(!av){
      const m=buildAnimal(mb.animal,shirtFor(mb)); scene.add(m.root);
      const tag=document.createElement('div'); tag.className='tag'; tag.innerHTML='<div class="bb"></div><div class="nm"></div>'; $('tags').appendChild(tag);
      const q=pos.get(mb.uid)||{x:0,z:0,ry:0};
      av={m,key,tag,bubble:tag.querySelector('.bb'),nm:tag.querySelector('.nm'),x:q.x,z:q.z,ry:q.ry,cur:{...POSE.ready},lastSt:0,swT:1,walkPh:0,moveSpd:0,bbT:null};
      avatars.set(mb.uid,av);
    }
    av.nm.textContent=(mb.mic?'🎤 ':'')+mb.name;
    av.nm.style.background=isP(mb.slot)?TEAM[mb.slot[0]].css:'#8f78e6';
  });
  avatars.forEach((av,uid)=>{ if(!live.has(uid)){ scene.remove(av.m.root); av.tag.remove(); avatars.delete(uid); } });
}

/* ==========================================================================
   11. 카메라 · 렌더 루프
   ========================================================================== */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.fov=w<h?70:52; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const camPos=new THREE.Vector3(0,9,-18), camLook=new THREE.Vector3(0,0.5,0);
function cameraTarget(t){
  const portrait=innerWidth<innerHeight;
  if(!mode || !myUid){ const a=t*0.1; return [new THREE.Vector3(Math.sin(a)*16,8,Math.cos(a)*16),new THREE.Vector3(0,0.5,0)]; }
  if(amPlayerNow()){
    const team=mySlot()[0], s=team==='A'?-1:1, fx=local.x*(portrait?0.7:0.35);
    const shortLand=!portrait && innerHeight<520;   // 가로로 눕힌 휴대폰: 조금 더 가깝게
    const back=portrait?14:shortLand?10.2:12.2, up=portrait?7.2:shortLand?4.9:5.6;
    return [new THREE.Vector3(fx,up,s*back),new THREE.Vector3(fx*0.5,0.9,-s*1.8)];
  }
  if(viewMode==='court') return [new THREE.Vector3(portrait?14:11.5,portrait?9:7,0),new THREE.Vector3(0,0.8,0)];
  // 내 캐릭터 뒤에서 코트 중앙을 바라보는 시점
  const dx=-local.x, dz=-local.z, d=Math.hypot(dx,dz);
  if(d>2.5){ const want=Math.atan2(dx,dz); let df=want-local.camYaw; df=Math.atan2(Math.sin(df),Math.cos(df)); local.camYaw+=df*0.04; }
  const fx=Math.sin(local.camYaw), fz=Math.cos(local.camYaw), dist=portrait?7.5:6.5;
  return [new THREE.Vector3(local.x-fx*dist,portrait?5.2:4.4,local.z-fz*dist),new THREE.Vector3(local.x+fx*2.5,1.0,local.z+fz*2.5)];
}
let lastT=performance.now();
const tmpV=new THREE.Vector3();
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=(now-lastT)/1000, dt=Math.min(0.1,rawDt); lastT=now;
  adaptQuality(rawDt);
  updateLocal(dt);
  const k=1-Math.exp(-dt*14);
  // 아바타
  if(S && mode){
    const avMap=new Map(S.av.map(a=>[a[0],a]));
    avatars.forEach((av,uid)=>{
      let x,z,ry,st,g,y;
      if(uid===myUid){ x=local.x; z=local.z; ry=local.ry; st=local.st; g=local.g; y=local.jy; }
      else { const a=avMap.get(uid); if(!a){ av.m.root.visible=false; av.tag.style.display='none'; return; } [,x,z,ry,st,g,y]=a; g/=9; y=y||0; }
      av.m.root.visible=true; av.tag.style.display='';
      const px=av.x, pz=av.z;
      if(uid===myUid){ av.x=x; av.z=z; } else { av.x+=(x-av.x)*k; av.z+=(z-av.z)*k; }
      av.moveSpd=Math.hypot(av.x-px,av.z-pz)/Math.max(dt,1e-3);
      let d=ry-av.ry; d=Math.atan2(Math.sin(d),Math.cos(d)); av.ry+=d*Math.min(1,dt*12);
      av.y = uid===myUid ? y : (av.y||0)+(y-(av.y||0))*Math.min(1,dt*20);
      av.m.root.position.set(av.x,av.y,av.z); av.m.root.rotation.y=av.ry;
      av.m.sh.position.y=0.03-av.y/1.05; av.m.ring.position.y=0.035-av.y/1.05;    // 그림자는 바닥에 남김
      av.m.sh.scale.setScalar(Math.max(0.5,1-av.y*0.45));
      animPose(av,st,g,dt);
      if(av.y>0.05){ av.m.legs[0].rotation.x=-0.7; av.m.legs[1].rotation.x=0.35; }
      // 내 링: 셔틀콕이 타격 범위 안이면 초록색
      av.m.ring.visible = uid===myUid;
      if(uid===myUid){ const sp=shuttleNow(); const inR=sp&&amPlayerNow()&&Math.hypot(sp.x-av.x,sp.z-av.z)<C.reach&&sp.y<3.4+local.jy&&Math.sign(sp.z)===sideOf(mySlot()[0]);
        av.m.ring.material.color.setHex(inR?0x3ee07a:0xffc93c); }
    });
  }
  // 셔틀콕
  if(S && IN_GAME.includes(S.ph)){
    shuttle.visible=true;
    let p;
    if(flLocal.id>=0){ flLocal.t=Math.min(flLocal.T,flLocal.t+(S.ph==='paused'?0:dt)); p=flightPos(flLocal,flLocal.t); }
    else p=S.sh;
    const prev=shuttle.position.clone();
    if(flLocal.id>=0) shuttle.position.set(p[0],p[1],p[2]);
    else { shuttle.position.x+=(p[0]-shuttle.position.x)*k*1.5; shuttle.position.y+=(p[1]-shuttle.position.y)*k*1.5; shuttle.position.z+=(p[2]-shuttle.position.z)*k*1.5; }
    const v=shuttle.position.clone().sub(prev);
    if(v.lengthSq()>1e-6) shuttle.lookAt(tmpV.copy(shuttle.position).add(v));
    shShadow.visible=true; shShadow.position.set(shuttle.position.x,0.03,shuttle.position.z);
    shShadow.material.opacity=0.45-Math.min(0.3,shuttle.position.y*0.06);
    ldRing.visible=flLocal.id>=0 && S.ph==='rally';
    if(ldRing.visible){ ldRing.position.x=flLocal.lx; ldRing.position.z=flLocal.lz; ldRing.scale.setScalar(1+0.15*Math.sin(now/120)); }
    drawScoreboard(S.sc[0],S.sc[1]);
  } else { shuttle.visible=false; shShadow.visible=false; ldRing.visible=false; if(S) drawScoreboard('-','-'); }
  // 카메라
  const [cp,cl]=cameraTarget(now/1000), ck=1-Math.exp(-dt*5);
  cp.x=clamp(cp.x,-11.6,11.6); cp.z=clamp(cp.z,-14.6,14.6); cp.y=Math.min(cp.y,9.5);   // 카메라가 벽 밖으로 나가지 않게
  camPos.lerp(cp,ck); camLook.lerp(cl,ck); camera.position.copy(camPos); camera.lookAt(camLook);
  if(!NO_RENDER) renderer.render(scene,camera);
  // 이름표 · 말풍선 위치
  const W=innerWidth,H=innerHeight;
  avatars.forEach(av=>{ if(!av.m.root.visible) return;
    tmpV.set(av.x,2.05+(av.y||0),av.z).project(camera);
    if(tmpV.z>1||tmpV.z<-1){ av.tag.style.display='none'; return; }
    const dist=camera.position.distanceTo(av.m.root.position);
    av.tag.style.transform=`translate(${(tmpV.x*0.5+0.5)*W}px,${(-tmpV.y*0.5+0.5)*H}px) translate(-50%,-100%) scale(${clamp(9/dist,0.6,1.1)})`;
  });
  hudFrame();
}
function hudFrame(){
  if(!mode) return;
  const inGame=S&&IN_GAME.includes(S.ph);
  if(inGame){
    $('scA').textContent=S.sc[0]; $('scB').textContent=S.sc[1];
    $('dotA').style.visibility=S.st==='A'?'visible':'hidden'; $('dotB').style.visibility=S.st==='B'?'visible':'hidden';
  }
  // 중앙 메시지
  let text='';
  if(inGame){
    if(S.ph==='point'||S.ph==='over') text=S.ms;
    else if(S.ph==='paused') text='⏸ 일시정지';
  }
  const hint=$('hint'); const serveMe=inGame&&S.ph==='serve'&&S.sv===myUid;
  hint.style.display=serveMe?'block':'none';
  if(serveMe) hint.textContent=IS_TOUCH?'🏸 내 서브! 화면을 눌렀다 떼세요':'🏸 내 서브! A를 눌렀다 떼세요';
  const el=$('msg');
  if(!flashOn){ if(el.textContent!==text) el.textContent=text; el.style.opacity=text?1:0; el.style.visibility=text?'visible':'hidden'; } else { el.style.opacity=1; el.style.visibility='visible'; }
  const wi=$('winImg'); const showWin=S&&S.ph==='over'&&S.win;
  if(showWin){ wi.src=S.win==='A'?ASSET.duck_blue:ASSET.duck_red; wi.style.display='block'; } else wi.style.display='none';
  // 게이지
  const gg=$('gauge'); const showG=local.charging||local.swingT>0;
  gg.classList.toggle('on',showG && myUid>0);
  if(showG){ const v=local.charging?local.g:gg._last||0; if(local.charging) gg._last=local.g;
    $('gCover').style.width=(100-v*100)+'%';
    $('gLbl').textContent = v<0.35?'살살 (드롭)':v<0.75?'보통 (클리어)':v<0.92?'세게 (스매시)':'너무 셈! 아웃 주의'; }
  // 상태 변화 반영 (선수/관중 전환 등)
  const pn=amPlayerNow(); if(pn!==hudFrame._p){ hudFrame._p=pn; updateHud(true); }
}
requestAnimationFrame(frame);

// 테스트·디버그용 (게임 동작에는 영향 없음)
window.__gb={ get G(){return G;}, get S(){return S;}, get mode(){return mode;}, get members(){return members;}, get myUid(){return myUid;},
  local, keys, avatars, outCalls, audios, get micOn(){return !!micStream;} };
</script>
